<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Quality Checks in Python</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Ubuntu"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.css"
    />
    <style>
      code.language-python {
        font-family: "Ubuntu Mono", monospace;
        font-size: 0.95rem;
        white-space: pre-wrap;
      }
      body {
        font-family: "Ubuntu", sans-serif;
        margin: 0;
        padding: 1rem;
        background: #ffffff;
        color: #333;
      }

      section {
        max-width: 90%;
        margin: 0 auto;
        padding: 1rem;
      }

      .syntax-block {
        margin-top: 5%;
        margin-bottom: 2rem;
        padding: 1rem;
        background: #f9f9f9;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .syntax-block h2 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #2c3e50;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 8px;
        border-bottom: 1px solid #eee;
        vertical-align: top;
      }

      th {
        background-color: #f0f0f0;
        text-align: left;
      }

      pre {
        margin: 0;
        background: #f9f9f9;
        padding: 0.5rem;
        border-radius: 4px;
        overflow-x: auto;
      }

      code {
        font-family: "Ubuntu Mono", monospace;
        font-size: 0.95rem;
      }

      .token.keyword {
        color: #5c66f3;
      }
      .token.string {
        color: #013d01;
      }
      .token.comment {
        color: #999a9b;
        font-style: italic;
      }
      .token.number {
        color: #ff0000;
      }
    </style>
  </head>
  <body>
    <section>
      <div id="syntax_python"></div>
      <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
      <!-- PapaParse for CSV parsing -->
      <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
      <!-- Marked.js for Markdown rendering -->
      <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

      <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
      <script>
        const sheetURL =
          "https://docs.google.com/spreadsheets/d/e/2PACX-1vQm_vLeFV9gGPjpROT9I2PM0OmblZC_rsVe-7vy0QbOxQH5gnkWR7K8TMyrEeDAHeN3OgbsZGNJJDGK/pub?gid=0&single=true&output=csv";

        fetch(sheetURL)
          .then((response) => response.text())
          .then((csvText) => {
            const parsed = Papa.parse(csvText, {
              header: true,
              skipEmptyLines: true,
            });

            const rows = parsed.data.filter(
              (row) =>
                row.is_display && row.is_display.trim().toLowerCase() === "true"
            );

            // Group rows by seq_num_div
            const grouped = {};
            rows.forEach((row) => {
              const groupKey = String(row.seq_num_row).trim();

              if (!grouped[groupKey]) {
                grouped[groupKey] = {
                  heading: String(row.div_heading).trim(),
                  body: String(row.div_body || "").trim(), // ✅ Add this line
                  items: [],
                };
              }

              grouped[groupKey].items.push({
                Pandas: String(row.code_on_Pandas || "").trim(),
                Pyspark: String(row.code_on_Pyspark || "").trim(),
                comments_ifany: String(row.Comment_if_any || "").trim(), // Markdown content
                rowSeq: Number.parseInt(groupKey, 10),
              });
            });

            const container = document.getElementById("syntax_python");

            Object.keys(grouped)
              .sort((a, b) => parseInt(a) - parseInt(b))
              .forEach((groupKey) => {
                const group = grouped[groupKey];

                const div = document.createElement("div");
                div.className = "syntax-block";
                div.style.marginBottom = ".5rem";
                div.style.marginTop = "1rem";
                div.style.padding = "1rem";
                div.style.background = "#f9f9f9";
                div.style.border = "1px solid #ccc";
                div.style.borderRadius = "8px";

                const heading = document.createElement("h2");
                heading.textContent = group.heading;
                heading.style.marginBottom = "1rem";
                div.appendChild(heading);

                const table = document.createElement("table");
                table.style.width = "95%";
                table.style.margin = "0 auto";
                table.style.tableLayout = "fixed";
                table.style.borderCollapse = "collapse";

                // 🔻 Render div_body using Markdown
                const bodyBlock = document.createElement("div");
                bodyBlock.innerHTML = marked.parse(group.body || "");
                bodyBlock.style.marginBottom = "1rem";
                bodyBlock.style.textAlign = "left";
                bodyBlock.style.fontSize = "1rem";
                bodyBlock.style.lineHeight = "1.2";
                bodyBlock.style.background = "#f9f9f9";
                bodyBlock.style.padding = "0.5rem";
                bodyBlock.style.borderRadius = "10px";
                div.appendChild(bodyBlock);

                const thead = document.createElement("thead");
                thead.innerHTML = `
      <tr>
        <th style="text-align:left; padding:8px; border-bottom:1px solid #ccc; width: 50%;">Python - Pandas</th>
        <th style="text-align:left; padding:8px; border-bottom:1px solid #ccc; width: 50%;">Python - PySpark</th>
      </tr>`;
                table.appendChild(thead);

                const tbody = document.createElement("tbody");
                group.items
                  .sort((a, b) => a.rowSeq - b.rowSeq)
                  .forEach((item) => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
          <td style="padding:8px; border-bottom:1px solid #eee; width: 50%;">
            <pre><code class="language-python">${Prism.highlight(
              item.Pandas,
              Prism.languages.python,
              "python"
            )}</code></pre>
          </td>
          <td style="padding:8px; border-bottom:1px solid #eee; width: 50%;">
            <pre><code class="language-python">${Prism.highlight(
              item.Pyspark,
              Prism.languages.python,
              "python"
            )}</code></pre>
          </td>
        `;
                    tbody.appendChild(row);
                  });

                table.appendChild(tbody);
                div.appendChild(table);

                // 🔻 Add comments below the table
                group.items.forEach((item) => {
                  if (item.comments_ifany) {
                    const commentBlock = document.createElement("div");
                    commentBlock.innerHTML = marked.parse(item.comments_ifany);
                    commentBlock.style.marginBottom = "1rem";
                    commentBlock.style.textAlign = "left";
                    commentBlock.style.fontSize = "1rem";
                    commentBlock.style.lineHeight = "1.0";
                    commentBlock.style.background = "white";
                    commentBlock.style.padding = "0.5rem";
                    commentBlock.style.borderRadius = "10px";
                    div.appendChild(commentBlock);
                  }
                });

                container.appendChild(div);
              });
          })
          .catch((error) => {
            console.error("Error loading syntax blocks:", error);
            document.getElementById("syntax_python").innerHTML =
              "<p>Failed to load Python syntax. Please try again later.</p>";
          });
      </script>
    </section>
  </body>
</html>
